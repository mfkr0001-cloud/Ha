
name: Build Android Geode mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android32
            configure-args: -DANDROID_ABI=armeabi-v7a
          - platform: Android64
            configure-args: -DANDROID_ABI=arm64-v8a

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          build-config: Release
          configure-args: ${{ matrix.configure-args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GDToolsReplayLab-${{ matrix.platform }}
          path: build/**/*.geode
          if-no-files-found: warn
